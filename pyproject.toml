[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xvenue"
version = "0.1.0"
description = "M1 prototype: parse RDSL and check settlement relations with Z3"
requires-python = ">=3.11"
dependencies = ["z3-solver>=4.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
xvenue = "xvenue.cli:main"

[tool.setuptools.packages.find]
where = ["compiler/src"]

[tool.pytest.ini_options]
testpaths = ["compiler/tests"]
pythonpath = ["compiler/src"]
